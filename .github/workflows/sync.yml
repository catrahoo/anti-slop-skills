name: Sync skills dari repo asli

on:
  schedule:
    - cron: "17 1 * * 1"   # tiap Senin 08:17 WIB
  workflow_dispatch:        # bisa dijalankan manual dari tab Actions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tarik versi terbaru
        run: bash scripts/sync.sh
      - name: Commit kalau ada perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan"
          else
            git commit -m "chore: sync skills dari repo asli"
            git push
          fi
